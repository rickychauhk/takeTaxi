# Taxi MA UAT — install on EC2: /etc/nginx/conf.d/taxima.hkcodai.space.conf
# Upstreams (host ports from docs/PORTS.md):
#   API/WS: 127.0.0.1:3200
#   CRM:    127.0.0.1:3201

upstream taxima_uat_api {
    server 127.0.0.1:3200;
    keepalive 16;
}

upstream taxima_uat_crm {
    server 127.0.0.1:3201;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name taxima.hkcodai.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name taxima.hkcodai.space;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/taxima.hkcodai.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taxima.hkcodai.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 50M;
    proxy_connect_timeout 60s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    include /etc/nginx/snippets/taxima-maintenance.inc;
    error_page 503 /maintenance.html;

    location /api/ {
        if (-f /var/www/taxima-maintenance/enabled) {
            add_header Content-Type application/json always;
            add_header Retry-After 300 always;
            return 503 '{"ok":false,"maintenance":true,"message":"系統更新中，請稍後重試"}';
        }
        proxy_pass http://taxima_uat_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        if (-f /var/www/taxima-maintenance/enabled) {
            add_header Retry-After 300 always;
            return 503;
        }
        proxy_pass http://taxima_uat_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://taxima_uat_api/api/v1/health;
    }

    location / {
        if (-f /var/www/taxima-maintenance/enabled) {
            return 503;
        }
        proxy_pass http://taxima_uat_crm/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
