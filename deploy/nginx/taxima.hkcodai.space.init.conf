# Step 1: HTTP only for certbot webroot (before TLS cert exists)
server {
    listen 80;
    listen [::]:80;
    server_name taxima.hkcodai.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 200 'taxima uat pending tls';
        add_header Content-Type text/plain;
    }
}
