# PROD — HTTP only (Let's Encrypt webroot). Replace with app.hktaketaxi.online.conf after cert.
server {
    listen 80;
    listen [::]:80;
    server_name app.hktaketaxi.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 200 'Taxi Ma PROD — pending HTTPS setup';
        add_header Content-Type text/plain;
    }
}
