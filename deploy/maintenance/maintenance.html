<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>系統更新中｜Taxi MA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(160deg, #0f172a 0%, #1e293b 45%, #334155 100%);
      color: #f1f5f9;
      padding: 1.5rem;
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 2.25rem 1.75rem;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
    }
    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.25rem;
      border-radius: 50%;
      background: rgba(251, 191, 36, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    p {
      margin: 0;
      line-height: 1.65;
      color: #cbd5e1;
      font-size: 0.95rem;
    }
    .hint {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">⚙️</div>
    <h1>系統更新中</h1>
    <p>我們正在部署新版本，服務暫時無法使用。請稍候數分鐘後再重新整理或再訪。</p>
    <p class="hint">System update in progress — please try again shortly.</p>
  </div>
</body>
</html>
